# Configuración de Virtual Host para Laragon
# Coloca este archivo en: C:\laragon\etc\apache2\sites-enabled\preventionworld.conf
# O en: C:\laragon\bin\apache\apache[version]\conf\extra\httpd-vhosts.conf

<VirtualHost *:80>
    ServerName preventionworld.test
    ServerAlias www.preventionworld.test
    DocumentRoot "C:/laragon/www/SAMS2/public"
    
    <Directory "C:/laragon/www/SAMS2/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    ErrorLog "C:/laragon/logs/preventionworld_error.log"
    CustomLog "C:/laragon/logs/preventionworld_access.log" common
</VirtualHost>
